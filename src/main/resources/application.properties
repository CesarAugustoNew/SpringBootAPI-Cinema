spring.application.name=Filmes

# Servidor — Render injeta a porta via variável de ambiente PORT
server.port=${PORT:8080}

# Banco de dados PostgreSQL (reaproveita o mesmo banco do Pintura-Po e
# do Senai Notes, cada projeto isolado no seu próprio schema — aqui,
# "cinema"). Localmente, sem essas variáveis definidas, cai num banco
# Postgres local chamado "cinema".
#
# Formato esperado de DATABASE_URL (sem usuário/senha embutidos):
#   jdbc:postgresql://HOST/NOME_DO_BANCO?currentSchema=cinema
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cinema?currentSchema=cinema}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Schema próprio deste projeto dentro do banco compartilhado.
spring.jpa.properties.hibernate.default_schema=cinema
# Propriedade que resolveu o bug "schema does not exist" no Senai
# Notes: sem ela, o Hibernate só tenta ALTER TABLE achando que as
# tabelas já existem em outro lugar, e nunca cria o schema/tabelas de
# verdade na primeira vez.
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT
jwt.secret=${JWT_SECRET:cinema-reserva-jwt-chave-secreta-muito-segura-256-bits-ou-mais-longa-aqui}
jwt.expiration=86400000
