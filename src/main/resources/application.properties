spring.application.name=Filmes

# Servidor — Render injeta a porta via variável de ambiente PORT
server.port=${PORT:8080}

# Banco no Supabase (compartilhado com outros projetos, cada um no seu schema).
# Usar o Session pooler (IPv4), não a conexão direta (só IPv6, o Render não alcança):
#   DATABASE_URL=jdbc:postgresql://aws-0-<regiao>.pooler.supabase.com:5432/postgres?currentSchema=cinema&sslmode=require
#   DATABASE_USERNAME=postgres.<project-ref>
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cinema?currentSchema=cinema}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Schema próprio deste projeto dentro do banco compartilhado.
spring.jpa.properties.hibernate.default_schema=cinema
# Propriedade que resolveu o bug "schema does not exist" no Senai
# Notes: sem ela, o Hibernate só tenta ALTER TABLE achando que as
# tabelas já existem em outro lugar, e nunca cria o schema/tabelas de
# verdade na primeira vez.
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT
jwt.secret=${JWT_SECRET:cinema-reserva-jwt-chave-secreta-muito-segura-256-bits-ou-mais-longa-aqui}
jwt.expiration=86400000

# Ajustes pra caber no limite de 512Mi de RAM do Render free.
server.tomcat.threads.max=30
server.tomcat.threads.min-spare=4
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=2

